<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMPCyppieAgents</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <!-- CYP-152 / CYP-188 — PUBLIC build: this file is TOKENLESS by construction and MUST stay so. The operator
         token is supplied ONLY by the DEPLOY environment as a host-injected global, at serve time, BEFORE the
         bundle loads — it is NEVER committed here and NEVER part of the compiled .js/.wasm. The public serve
         injects nothing → defaultShellConfig reads absent/blank → operatorToken=null → fail-closed participant
         view (CYP-188 same-origin base means the ory_kratos_session session cookie carries a logged-in end-user).
         Operator serve is a SEPARATE deploy concern (build-separation is ours, serve-separation + a tokenless
         re-verify of the served bundle is the deploy's). Do NOT add an active operator-token <script> to this
         public file; the injection below is the deploy's global, e.g. (NOT present in this build):
             <script>globalThis.CYPPIE_OPERATOR_TOKEN = "…from the deploy/launch env…";</script> -->
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
