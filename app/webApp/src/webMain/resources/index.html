<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMPCyppieAgents</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <!-- CYP-152: operator context is supplied by the DEPLOY environment, never baked into the bundle.
         To serve this build as an OPERATOR, the host injects the token as a global BEFORE the app
         bundle below loads, e.g.:
             <script>globalThis.CYPPIE_OPERATOR_TOKEN = "…token from the deploy/launch env…";</script>
         Omitted by default → fail-closed participant view (defaultShellConfig reads it; absent/blank →
         null). The token is NEVER committed to this file and NEVER part of the compiled .js/.wasm. -->
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
