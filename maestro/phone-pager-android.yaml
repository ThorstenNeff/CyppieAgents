# CYP-50 / S10 — Phone-Pager Android flow (Maestro, native Compose target).
#
# Device-verify for the smartphone single-window pager on the native path (the authoritative gate, like
# CYP-47/48). On a real phone the WindowHost measures Compact width → it renders the snap HorizontalPager
# instead of the desktop canvas. Exercises the canonical testTags (docs/design/phone-pager-tags.md, area
# `phonePager`) — NO text/localizable selectors (Test-Contract §4):
#   * the pager appears and the canvas does NOT (mode separation: window.host XOR phonePager.pager),
#   * the multi-page indicator is present (4 stub windows → 4 real pages),
#   * a tappable dot jumps to its page and the active-state marker (shape/size, not colour) follows,
#   * the next-affordance advances the page and the active marker moves with it.
#
# Maestro `id:` selectors are REGEX → dots escaped (\.), anchored (^…$), SINGLE-QUOTED so YAML keeps the
# backslashes literal. On Android the testTags surface as view resource-ids via
# Modifier.enableTestTagsAsResourceId() at the demo root (CYP-15).
#
# PREREQUISITES (tester runtime; Dev's sandbox has no emulator/Maestro):
#   * Install + launch the DEDICATED demo build `:app:androidAppDemo` (appId com.tneff.cyppieagents.demo).
#     DemoActivity's `demo.tab.pager` mounts the REAL WindowHost with 4 stub windows (po/frontend/backend/
#     comm) + trivial stub content — hermetic, no server. On a phone (~411dp, Compact width) the host renders
#     the pager. Pages follow the STABLE window order (po, frontend, backend, comm); the pager opens on the
#     focused (last) window "comm".
appId: com.tneff.cyppieagents.demo
name: "CYP-50 Phone-Pager (Android) — Compact -> pager (not canvas) -> dot nav -> next advances"
tags:
  - gating
  - pager
---
- launchApp

# Select the pager tab (mounts the real WindowHost full-screen).
- tapOn:
    id: '^demo\.tab\.pager$'

# Compact phone viewport → the pager renders and the canvas does NOT (mode separation is the contract).
- assertVisible:
    id: '^phonePager\.pager$'
    label: "Phone viewport (Compact) → HorizontalPager present"
- assertNotVisible:
    id: '^window\.host$'
    label: "Canvas host absent in pager mode (window.host XOR phonePager.pager)"

# 4 windows → 4 real pages → the multi-page indicator is present (a lone page would show no chrome).
- assertVisible:
    id: '^phonePager\.indicator$'
    label: "Multi-page indicator present (4 stub pages)"

# Tap the first page's dot → the pager jumps to it and the active-state marker (shape/size, not colour
# alone) is now on that dot.
- tapOn:
    id: '^phonePager\.indicator\.dot\.po$'
- assertVisible:
    id: '^phonePager\.page\.po$'
    label: "Tappable dot navigates to the Product-Owner page"
- assertVisible:
    id: '^phonePager\.indicator\.dot\.po\.active$'
    label: "Active-state marker follows to the selected page (a11y, not colour-only)"

# The next affordance advances one page in the STABLE order (po → frontend) and the active marker moves.
- tapOn:
    id: '^phonePager\.next$'
- assertVisible:
    id: '^phonePager\.indicator\.dot\.frontend\.active$'
    label: "Next advances to the frontend page; active marker moves with it"
