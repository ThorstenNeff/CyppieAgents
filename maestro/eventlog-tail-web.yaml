# CYP-42 — Event-Log Live-Tail web flow (Maestro, Wasm/Web target).
#
# Verifies the live stream + the Pause disclosure mechanics (paused != live), the buffered-count pill,
# and resume — against the canonical testTags (docs/design/event-log-tags.md), no text selectors.
#
# Maestro `id:` selectors are REGEX → dots escaped (\.), anchored (^…$), SINGLE-QUOTED (Test-Contract §4).
#
# PREREQUISITES (tester CYP-7 runtime; Dev's sandbox has no browser/Maestro):
#   * Wasm/Web build served at APP_URL in an OPERATOR context (cfg.operatorToken != null), Live-Tail
#     window focused, fed by a stub source that keeps streaming long enough that events arrive WHILE
#     paused (so the buffered-count pill appears) — e.g. StubEventsSource with a steady cadence.
#   * testTags exposed as resource-ids — Modifier.enableTestTagsAsResourceId() at the root (CYP-15).
url: "http://localhost:8080"
name: "CYP-42 Event-Log Live-Tail — stream -> pause (!= live) -> buffer -> resume"
tags:
  - gating
  - event-log
env:
  APP_URL: "http://localhost:8080"
---
- openLink: ${APP_URL}

# Live stream present + honestly live (socket open, not paused).
- assertVisible:
    id: '^eventTail\.stream$'
    label: "Live-Tail stream addressable (operator-gated surface present)"
- assertVisible:
    id: '^eventTail\.liveIndicator$'
    label: "Live indicator shown while the socket is open and not paused"
- scrollUntilVisible:
    element:
      id: '^eventTail\.row\.0$'
    direction: DOWN
    timeout: 10000

# Pause -> paused != live: the paused marker appears, the live indicator is gone (§7.2 honesty).
- tapOn:
    id: '^eventTail\.pauseToggle$'
- assertVisible:
    id: '^eventTail\.pausedIndicator$'
    label: "Paused marker shown"
- assertNotVisible:
    id: '^eventTail\.liveIndicator$'
    label: "Live indicator hidden while paused (paused != live)"

# While paused, incoming events buffer with an honest count (no silent loss).
- assertVisible:
    id: '^eventTail\.bufferedCount$'
    label: "Buffered-count pill shown for events received while paused"

# Resume -> live again (no loss; the buffer flushes into the visible tail).
- tapOn:
    id: '^eventTail\.pauseToggle$'
- assertVisible:
    id: '^eventTail\.liveIndicator$'
    label: "Live indicator returns after resume"
