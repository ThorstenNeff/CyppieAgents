# CYP-11 — Web smoke flow (Maestro), Wasm/Web target.
#
# Proves the two points the iOS-tester required for the Wasm smoke (Test-Contract v0.5 §2/§4):
#   (1) a testTag is addressable on the Wasm canvas, and
#   (2) scrollUntilVisible reaches an OFF-SCREEN list row (only composed/visible nodes exist).
#
# Maestro `id:` selectors are REGEX → separator dots are escaped (\.) and the tag is anchored
# (^…$). The selector scalars are SINGLE-QUOTED so YAML keeps the backslashes literal — in a
# double-quoted scalar `\.` is an invalid escape and the anchoring breaks (CYP-11 review fix).
#
# PREREQUISITES (see README.md) — this flow is authored by Dev but its RUNTIME verification belongs
# to the tester's (CYP-7) environment; Dev's sandbox has no browser/Maestro:
#   * Wasm/Web build served at the url below (override with `-e APP_URL=…`).
#   * The served screen exposes testTags as resource-ids — `Modifier.enableTestTagsAsResourceId()`
#     at the app/window root (wired in CYP-15). Wasm mechanism verified in the tester's spike.
#   * The screen renders the agent stream for agentId "backend" with enough event rows that the
#     target row starts off-screen (the CYP-6 renderer on a scripted scenario, or a harness).
#
# NOTE: web-flow header uses `url:` + `openLink` (not `appId:`). Validate the exact web header
# against the installed Maestro version's web schema (tester).
url: "http://localhost:8080"
name: "CYP-11 Web smoke — testTag addressable + off-screen scroll"
tags:
  - smoke
  - gating
env:
  APP_URL: "http://localhost:8080"
---
- openLink: ${APP_URL}

# (1) a tagged element is addressable on the canvas
- assertVisible:
    id: '^agent\.backend\.input$'
    label: "Agent input addressable via testTag on the Wasm canvas"

# (2) an off-screen stream row is reached only by scrolling its container
- scrollUntilVisible:
    element:
      id: '^agent\.backend\.event\.5$'
    direction: DOWN
    timeout: 10000
    label: "Scroll the stream until an initially off-screen event row is visible"
- assertVisible:
    id: '^agent\.backend\.event\.5$'
    label: "Off-screen event row is visible after scroll"
