# CYP-69 (CYP-42 parity) — Event-Log Live-Tail iOS flow (Maestro, native CMP).
#
# iOS variant of `eventlog-tail-android.yaml`. Verifies the live stream + the Pause disclosure
# mechanics (paused != live), the buffered-count pill, and resume — against the canonical testTags
# (docs/design/event-log-tags.md), no text selectors.
#
# Maestro `id:` selectors are REGEX → dots escaped (\.), anchored (^…$), SINGLE-QUOTED (Test-Contract §4).
#
# ## iOS-specific notes — BLOCKED ON iOS-DEMO-TARGET (CYP-69 finding)
#
# 1. **appId** — single iOS bundle `com.tneff.cyppieagents.KMPCyppieAgents`. **No iOS demo target
#    exists.** Android uses `:app:androidAppDemo` (`com.tneff.cyppieagents.demo`) whose `DemoActivity`
#    mounts `EventTailPanel` FULL-SCREEN fed by `SteadyDemoEventsSource` — the steady cadence is what
#    makes `eventTail.bufferedCount` reliably observable while paused. iOS has only the prod
#    `MainViewController()` → `App()` path, where Live-Tail is operator-gated and OMITTED in the
#    default non-operator context (see `eventlog-presence-ios.yaml`).
#
#    **CYP-69 finding (separately filed):** an `iosAppDemo` equivalent (or an in-app demo entry
#    behind a test flag) is required for this flow to run on iOS. Until that lands this flow stays
#    a draft — even after CYP-67.
#
# 2. **Selectors assume the panel is mounted full-screen** — same testTags as Android. The Android
#    flow first taps `demo.tab.tail`; this iOS draft omits that tap because there is no iOS demo tab.
#    A future iOS demo entry must mount `EventTailPanel` full-screen with a steady stub source.
#
# 3. **Pre-CYP-67 caveat** — testTags are not yet accessibilityIdentifiers on iOS; even with a demo
#    target this flow only resolves after CYP-67 merges.
#
# PREREQUISITES (tester runtime — incomplete until the demo-target finding is closed):
#   * **(blocking)** iOS demo entry mounting `EventTailPanel` full-screen with a steady stub source
#     (events arriving WHILE paused so the buffered-count pill renders).
#   * Built + installed on an iPhone Simulator (Xcode 16.4, iOS 26.6).
#   * iosMain `enableTestTagsAsResourceId()` actual wired (CYP-67).
appId: com.tneff.cyppieagents.KMPCyppieAgents
name: "CYP-69/CYP-42 Event-Log Live-Tail (iOS) — stream -> pause (!= live) -> buffer -> resume"
tags:
  - gating
  - event-log
  - ios
---
- launchApp

# Live stream present + honestly live (socket open, not paused).
- assertVisible:
    id: '^eventTail\.stream$'
    label: "Live-Tail stream addressable (operator-gated surface present)"
- assertVisible:
    id: '^eventTail\.liveIndicator$'
    label: "Live indicator shown while the socket is open and not paused"
- scrollUntilVisible:
    element:
      id: '^eventTail\.row\.0$'
    direction: DOWN
    timeout: 10000

# Pause -> paused != live: the paused marker appears, the live indicator is gone (§7.2 honesty).
- tapOn:
    id: '^eventTail\.pauseToggle$'
- assertVisible:
    id: '^eventTail\.pausedIndicator$'
    label: "Paused marker shown"
- assertNotVisible:
    id: '^eventTail\.liveIndicator$'
    label: "Live indicator hidden while paused (paused != live)"

# While paused, incoming events buffer with an honest count (no silent loss).
- assertVisible:
    id: '^eventTail\.bufferedCount$'
    label: "Buffered-count pill shown for events received while paused"

# Resume -> live again (no loss; the buffer flushes into the visible tail).
- tapOn:
    id: '^eventTail\.pauseToggle$'
- assertVisible:
    id: '^eventTail\.liveIndicator$'
    label: "Live indicator returns after resume"
