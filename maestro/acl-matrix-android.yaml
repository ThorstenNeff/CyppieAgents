# CYP-48 — ACL-Matrix Android flow (Maestro, native Compose target).
#
# Device-verify for the S7 ACL-matrix UI on the native path (the same gate CYP-47 added for the
# Event-Log). Exercises the CYP-19 disclosure-critical paths against the canonical testTags
# (docs/design/acl-matrix-tags.md, area `aclMatrix`) — NO text/localizable selectors (Test-Contract §4):
#   * the matrix appears, an operator R/W toggle round-trips to `enforced` (hub echo = source of truth),
#   * a PO-critical cell opens the advisory consequence dialog (not a silent toggle),
#   * confirming it hits the server-guard 409 path → the cell reverts to `protected` (acl_po_protected),
#   * the narrow-cards responsiveness (phone viewport < 600dp inner width → per-channel cards).
#
# Maestro `id:` selectors are REGEX → dots escaped (\.), anchored (^…$), SINGLE-QUOTED so YAML keeps the
# backslashes literal. On Android the testTags surface as view resource-ids via
# Modifier.enableTestTagsAsResourceId() at the demo root (CYP-15).
#
# PREREQUISITES (tester runtime; Dev's sandbox has no emulator/Maestro):
#   * Install + launch the DEDICATED demo build `:app:androidAppDemo` (appId com.tneff.cyppieagents.demo).
#     DemoActivity's `demo.tab.acl` renders AclPanel FULL-SCREEN in an OPERATOR context (editable) fed by
#     StubAclHub(rejectPoLockout = true) — an in-memory hub that echoes AclEvent on setAcl AND mirrors the
#     CYP-49 server guard (409 po_lockout_protected) — so the enforced + protected paths run WITHOUT a
#     server. On a phone (~411dp) the panel is below the 600dp breakpoint → narrow per-channel cards.
appId: com.tneff.cyppieagents.demo
name: "CYP-48 ACL-Matrix (Android) — grid -> operator toggle -> PO lockout dialog -> 409 protected"
tags:
  - gating
  - acl
---
- launchApp

# Select the ACL tab (full-screen panel).
- tapOn:
    id: '^demo\.tab\.acl$'

# Narrow viewport → the matrix is the per-channel card list (responsiveness). Open a HUB spoke.
- assertVisible:
    id: '^aclMatrix\.grid$'
    label: "ACL matrix surface present (narrow channel-card list on a phone)"
- tapOn:
    id: '^aclMatrix\.rowHeader\.po-frontend$'

# Operator toggle on a WORKER grant is unguarded → optimistic, then the hub echoes AclEvent and the cell
# becomes enforced (pending != enforced; the echo is the source of truth, not the PUT-200).
- assertVisible:
    id: '^aclMatrix\.cell\.po-frontend\.frontend\.read$'
    label: "Member R switch present (operator-editable)"
- tapOn:
    id: '^aclMatrix\.cell\.po-frontend\.frontend\.read$'
- assertVisible:
    id: '^aclMatrix\.cell\.po-frontend\.frontend\.enforced$'
    label: "Worker toggle round-trips through the hub echo to enforced"

# A PO-critical cell (PO read on a HUB spoke) must open the advisory consequence dialog — never a silent
# toggle (the UI guardrail).
- assertVisible:
    id: '^aclMatrix\.cell\.po-frontend\.po\.poCritical$'
    label: "PO-critical marker present on the PO HUB-spoke cell"
- tapOn:
    id: '^aclMatrix\.cell\.po-frontend\.po\.read$'
- assertVisible:
    id: '^aclMatrix\.lockoutDialog$'
    label: "PO-lockout consequence dialog opens (advisory, not silent)"

# Confirming routes the PUT to the server guard → 409 po_lockout_protected → the cell reverts to the hub
# state and shows the `protected` disclosure (the real enforcement, CYP-49; the UI warning is advisory).
- tapOn:
    id: '^aclMatrix\.lockoutDialog\.confirm$'
- assertVisible:
    id: '^aclMatrix\.cell\.po-frontend\.po\.protected$'
    label: "Server-guard 409 → cell reverts to protected (acl_po_protected), not a applied lockout"
