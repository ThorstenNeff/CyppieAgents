# CYP-69 Phase ④ — Phone-Pager iOS flow (Maestro, Compose-iOS target). PRE-DRAFT (2026-06-29).
#
# Port of phone-pager-android.yaml; iOS port owner = iOS-Tester (CYP-69). RUN/FINALIZE once iOS-Dev's
# demo-target (CYP-69 ①) lands — appId + selectors pre-filled from iOS-Dev's inspect_screen handoff.
#
# On an iPhone (Compact width) the WindowHost renders the snap HorizontalPager, NOT the desktop canvas —
# so on iOS the pager is the natural surface (no window.host). Exercises the canonical phonePager.*
# testTags (area `phonePager`) — NO text/localizable selectors (Test-Contract §4):
#   * the pager appears and the canvas does NOT (mode separation: window.host XOR phonePager.pager),
#   * the multi-page indicator is present (4 demo stub windows → 4 real pages),
#   * a tappable dot jumps to its page and the active-state marker (shape/size, not colour) follows,
#   * the next-affordance advances the page and the active marker moves with it.
#
# Maestro `id:` selectors are REGEX → dots escaped (\.), anchored (^…$), SINGLE-QUOTED so YAML keeps the
# backslashes literal. On iOS testTags surface as accessibilityIdentifiers (CYP-67 @12dd975 — addressable;
# the testTagA11y container-swaps ③ are a no-op per iOS-Dev's pass).
#
# PREREQUISITES (tester runtime; baseline pair Xcode 26.6 / iOS-Sim 26.5, booted iPhone 17):
#   * Build + launch the DEDICATED iOS demo build (appId com.tneff.cyppieagents.demo). Its `demo.tab.pager`
#     mounts the REAL WindowHost with 4 stub windows (po/frontend/backend/comm) + trivial stub content —
#     hermetic, no server. On an iPhone sim (Compact width) the host renders the pager. Pages follow the
#     STABLE window order (po, frontend, backend, comm); the pager opens on the focused (last) window comm.
appId: com.tneff.cyppieagents.demo
name: "CYP-69 Phone-Pager (iOS) — Compact -> pager (not canvas) -> dot nav -> next advances"
tags:
  - gating
  - pager
  - ios
---
- launchApp

# Select the pager tab (mounts the real WindowHost full-screen).
- tapOn:
    id: '^demo\.tab\.pager$'

# Compact iPhone viewport → the pager renders and the canvas does NOT (mode separation is the contract).
- assertVisible:
    id: '^phonePager\.pager$'
    label: "iPhone viewport (Compact) -> HorizontalPager present"
- assertNotVisible:
    id: '^window\.host$'
    label: "Canvas host absent in pager mode (window.host XOR phonePager.pager)"

# 4 windows → 4 real pages → the multi-page indicator is present.
- assertVisible:
    id: '^phonePager\.indicator$'
    label: "Multi-page indicator present (4 stub pages)"

# Tap the first page's dot → the pager jumps to it and the active-state marker (shape/size, not colour
# alone) is now on that dot.
- tapOn:
    id: '^phonePager\.indicator\.dot\.po$'
- assertVisible:
    id: '^phonePager\.page\.po$'
    label: "Tappable dot navigates to the Product-Owner page"
- assertVisible:
    id: '^phonePager\.indicator\.dot\.po\.active$'
    label: "Active-state marker follows to the selected page (a11y, not colour-only)"

# The next affordance advances one page in the STABLE order (po → frontend) and the active marker moves.
- tapOn:
    id: '^phonePager\.next$'
- assertVisible:
    id: '^phonePager\.indicator\.dot\.frontend\.active$'
    label: "Next advances to the frontend page; active marker moves with it"
