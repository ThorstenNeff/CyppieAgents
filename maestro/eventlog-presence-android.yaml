# CYP-41/42 — Event-Log operator-gated PRESENCE/OMISSION Android flow (Maestro, native Compose target).
#
# Native-Android variant of eventlog-presence-web.yaml. Security surface (EVENT-LOG-UI §5.6 / §7):
# without an operator token the two Event-Log windows are NOT offered (omission — not a dead "no access"
# window). QA proves this by the ABSENCE of the window tags, exactly as the JVM render test
# (EventLogPresenceTest) does — same property, native-Android target.
#
# Maestro `id:` selectors are REGEX → dots escaped (\.), anchored (^…$), SINGLE-QUOTED (Test-Contract §4).
#
# PREREQUISITES (tester runtime):
#   * CYP-162 — CANVAS-MODE REQUIRED. This flow asserts the window SET (window.host / window.<id>),
#     which exists only in the desktop CANVAS layout. On a Compact phone (<600dp, e.g. Pixel_9a 411dp)
#     the WindowHost renders the PHONE-PAGER instead (phonePager.* / phonePager.page.<id>), where these
#     `window.*` frame tags are absent and set-presence isn't robustly assertable (a HorizontalPager
#     composes only near pages; >6 windows show a position counter, not per-window dots; the absence
#     case can't navigate to a non-existent page). Maestro flows cannot run adb/shell themselves
#     (`runScript` is a JS sandbox), so the tester WRAPS the run with a density override that flips the
#     SAME Pixel_9a to a Medium width → canvas mode (verified): no second AVD, no APK diff. Run as:
#         adb shell wm density 240   # 1080px / (240/160) = 720dp → Medium → canvas mode
#         maestro test maestro/eventlog-presence-android.yaml
#         adb shell wm density reset # cleanup
#     The `window.*` assertions below are then correct verbatim — no tag remapping, no pager-nav.
#   * Install + launch the PROD `:app:androidApp` (appId com.tneff.cyppieagents) — its default is a
#     NON-operator context (defaultShellConfig() → operatorToken == null). The agent + comm windows
#     still render; the two Event-Log windows must be omitted entirely. (This is the real prod build —
#     the omission proof is genuine; the demo appId is deliberately NOT used here.)
#   * testTags exposed as resource-ids — Modifier.enableTestTagsAsResourceId() at the root (CYP-15).
appId: com.tneff.cyppieagents
name: "CYP-41-42 Event-Log presence (Android) — windows omitted without operator token"
tags:
  - security
  - event-log
---
- launchApp

# The shell is up (host + a non-Event-Log window prove the app rendered) ...
- assertVisible:
    id: '^window\.host$'
    label: "Window host rendered"
- assertVisible:
    id: '^window\.comm$'
    label: "Comm window present in non-operator context (shell is functional)"

# ... but NEITHER Event-Log window exists — operator-gated omission, asserted via absence.
- assertNotVisible:
    id: '^window\.eventlog$'
    label: "Browse window omitted without operator token"
- assertNotVisible:
    id: '^window\.eventtail$'
    label: "Live-Tail window omitted without operator token"
