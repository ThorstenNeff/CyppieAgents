# CYP-687 (M1.1) — jpackage --add-launcher spec for the BYOA acceptance wire-client (ByoaAcceptanceMain). Adds a
# launcher (CyppieHubAcceptance) to the app-image alongside the hub launcher; it shares the app's --main-jar
# (server-<version>.jar) and only overrides the main class. Claude-free: it speaks /ws/hub (Hub-Wire-Protocol v1)
# directly to prove a REMOTE agent registers + connects + exchanges a message BOTH ways (the M1.1 A–E acceptance +
# the 4 fail-closed controls). Driven per-probe by deploy/linux/byoa-m1-acceptance.sh on the Ubuntu-26 box.
main-class=com.tneff.cyppieagents.acceptance.ByoaAcceptanceMainKt
