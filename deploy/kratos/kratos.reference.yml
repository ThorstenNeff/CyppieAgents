# CYP-178 / RC2 — Kratos SECURITY-REFERENCE config (NOT directly deployable).
#
# This file version-controls the security-relevant Kratos settings that the C1 (constant-time /
# account-enumeration) property depends on, so the deploy-coordinated LIVE behavioral probe (RC2
# option b) runs against an asserted, reproducible baseline instead of a hand-typed box config.
# `server/src/test/.../auth/Rc2ConfigAssertionTest` asserts the knobs below stay set.
#
# Deploy owns the INFRA values marked REPLACE_ME (dsn, secrets, base/public URLs, courier SMTP) and
# the final same_site/secure posture for the deployment origin. Never commit real secrets here.
#
# ⚠️ KRATOS VERSION PIN = v1.3.0 (config schema below is authored for it; Rc2ConfigAssertionTest binds it).
# `brew install ory/kratos/kratos` currently ships an INCOMPATIBLE v26.2.0 with a config schema break
# (e.g. `session.cookie.secure` string-vs-bool) → do NOT use brew. Install the pinned GitHub release binary:
#   github.com/ory/kratos/releases/tag/v1.3.0  (or the oryd/kratos:v1.3.0 Docker image).

version: v1.3.0

# CYP-190 — LOG HARDENING (Kratos-side; the hub's own log redaction is BG-WS-5, a SEPARATE process). Kratos
# logs its OWN request handling, and without this block it runs box defaults that carry cleartext session
# tokens (`ory_st_…`) and recovery/verification codes into kratos.log (deploy found 259). Pin the redaction:
#  - leak_sensitive_values: false → Kratos REDACTS secrets/tokens/codes from its logs (the MASTER switch;
#    `true` is exactly what leaks them — Ory's own guide is to set it false).
#  - level: info → do NOT log token-bearing request URIs/bodies (a `debug`/`trace` level would).
#  - format: json → structured (the default).
# Rc2ConfigAssertionTest binds these. Residual (documented, NOT this fix): v1.3.0 may still leak some sensitive
# values into error RESPONSES (fixed in v26) — that is the standing v26-upgrade re-probe track, separate from
# this logging fix; the live canary (deploy) confirms the log leak is closed.
log:
  level: info
  leak_sensitive_values: false
  format: json

dsn: REPLACE_ME # e.g. postgres://... (SQLite only for local dev)

serve:
  public:
    base_url: REPLACE_ME # e.g. https://api.cyppie-agents.com/.ory/kratos/public/
    cors:
      enabled: true
      allowed_origins:
        - REPLACE_ME # the SPA origin ONLY (never "*")
  admin:
    # RC4: the admin API (identity CRUD, privileged) must NOT be internet-exposed. Bind it to loopback
    # / the private network only; the platform reaches it over localhost. Enforced at the network layer.
    base_url: http://127.0.0.1:4434/

secrets:
  cookie:
    - REPLACE_ME # 32+ byte random; rotate-capable list
  cipher:
    - REPLACE_ME # 32 byte random

# RC2 (deploy live-probe finding) — the MASTER account-enumeration switch. The per-flow knobs
# (enable_legacy_one_step, notify_unknown_recipients) do NOT cover the login TIMING side-channel: with
# this false (Kratos default), a login for a NON-existent identifier skips the argon2 hash and returns in
# ~4ms while an existing-identifier wrong-password runs argon2 (~80ms) → the response is generic but the
# TIMING reveals account existence (measured 7.8×+ on the safe instance before this fix). TRUE makes Kratos
# dummy-hash for absent identifiers (timing equalized) AND registration/recovery generic (no exists-tell).
# Ory caveat (verbatim): "degrades UX + does not mitigate all possible attack vectors yet". On v1.3.0 this
# closes the enumeration CONTENT leak but NOT the login-TIMING one (absent identifiers are not dummy-hashed
# → ~35× faster than an existing-identifier wrong-password → existence leaks by timing). ACCEPTED posture
# (Auftraggeber decision A): throttle-mitigated (CYP-179, does not close) + localhost-bound until exposure;
# RE-EVALUATE before off-localhost exposure (v26 dummy-hash). Full record + exposure gate:
# deploy/kratos/RC2-KNOWN-LIMITATIONS.md (§A timing + §B registration-content). The leaky control keeps this FALSE so the
# probe's teeth-demo catches the P1-register exists-tell (4000007).
security:
  account_enumeration:
    mitigate: true

# CC2 — LOGIN BRUTE-FORCE POSTURE (the §8 flag-1 binding target). Decision: per-IP at the edge (Caddy,
# CYP-179) + per-account in Kratos, with NO hard account-lockout (a lockout is a victim-DoS: an attacker
# locks a known victim out on purpose — reviewer flag 1). OSS Kratos has NO per-account attempt-lockout
# knob and never locks accounts BY DESIGN; the per-account brute-force defense is therefore the argon2
# per-attempt COST FLOOR below (each guess is deliberately expensive), NOT a counter/lockout. The actual
# request-rate throttle is per-IP at the edge (CYP-179). Rc2ConfigAssertionTest binds flag-1 here:
# argon2 + a meaningful cost floor + the explicit no-lockout posture.
# CC2-NO-ACCOUNT-LOCKOUT: intentionally no lockout/max-attempts key — avoids the victim-DoS vector.
hashers:
  algorithm: argon2
  argon2:
    memory: 128MB
    iterations: 3 # cost floor: >= 2 (each online guess is expensive → per-account brute-force is slow)
    parallelism: 4
    salt_length: 16
    key_length: 32

# CYP-181 / P2.1 — SMTP courier: Kratos sends the recovery + verification (+ email-change) mails through it.
# ⚠️ Kratos does NOT interpolate ${VAR} in YAML — a `${...}` would be sent as a LITERAL string (broken). The
# real relay URI (which carries the SMTP password) is injected in PROD via the Kratos env-OVERRIDE path
# COURIER_SMTP_CONNECTION_URI (config path uppercased, dots→underscores; the env value OVERRIDES this line),
# so the secret is NEVER in this file or a log. The value below is a DEV-safe, credential-free default
# (mailpit) — no password, safe to commit.
courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true # DEV default (no creds); prod → COURIER_SMTP_CONNECTION_URI env
    from_address: no-reply@cyppie-agents.com # CYP-192: aligned to the product domain (deploy's SMTP/SPF-DKIM must carry @cyppie-agents.com)
    from_name: Cyppie

session:
  lifespan: 24h
  cookie:
    name: ory_kratos_session # MUST match the platform's KRATOS_SESSION_COOKIE constant (auth/Principal.kt)
    same_site: Lax # defense-in-depth: the session cookie is not sent on cross-site sub-requests
    secure: true # prod: cookie only over TLS (dev-only override to false behind localhost)
    persistent: true

selfservice:
  # SECURITY (CYP-562) — the post-login return-URL ALLOW-LIST is the OPEN-REDIRECT boundary. After a VALID login
  # Kratos 302s the browser to the `?return_to=` target ONLY if it matches an entry here. Each entry MUST be an
  # EXACT origin/URL — NEVER a wildcard, a scheme-only value, a host prefix, an all-interfaces host, or an origin
  # that also serves attacker-controlled user content. A too-broad entry is a post-auth open redirect (a session
  # can be handed to an attacker origin after a real login). Deploy MUST replace REPLACE_ME_SPA_ORIGIN with the
  # EXACT web SPA origin; the desktop loopback is FIXED (RFC 8252, desktopApp main.kt LOOPBACK_PORT=47472) — keep
  # it verbatim. Guarded by Rc2ConfigAssertionTest.kratosReferenceConfig_returnUrlAllowlist_hasOpenRedirectGuardrail;
  # see deploy/kratos/CYP-562-RETURN-URL-ALLOWLIST.md.
  default_browser_return_url: REPLACE_ME_SPA_ORIGIN
  allowed_return_urls:
    - REPLACE_ME_SPA_ORIGIN            # the web SPA origin, EXACT (e.g. https://app.cyppie-agents.com) — never a wildcard/prefix
    - http://127.0.0.1:47472/callback  # the desktop app's fixed loopback return (RFC 8252; main.kt LOOPBACK_PORT=47472)

  methods:
    password:
      enabled: true
    # CYP-183 / P4 — OIDC "Sign in with GitHub". Kratos owns the whole OAuth dance (state/PKCE/nonce,
    # callback exchange, mapper, account-linking). client_id is PUBLIC. ⚠️ Kratos does NOT interpolate ${VAR}
    # in YAML, so the client_secret is NOT written here (a `${...}` would be sent as a literal → GitHub
    # incorrect_client_credentials). In PROD the WHOLE providers array — INCLUDING client_secret — is injected
    # via the Kratos env-OVERRIDE SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS (a JSON array; deploy's proven
    # path, secret box-local, never in file/log), which OVERRIDES the block below. This block documents the
    # provider SHAPE; omitting client_secret here FAILS CLOSED (Kratos validation errors) if the env is missing
    # — better than shipping a broken literal. The linking-TAKEOVER safety (S1) is settled by the spike, not here.
    oidc:
      enabled: true
      config:
        providers:
          - id: github
            provider: github
            client_id: Ov23lioeKkKuWAesQBKT # PUBLIC — safe in the repo
            # client_secret: NOT here — injected via SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS env (see above).
            scope:
              - user:email
            mapper_url: file:///etc/config/kratos/oidc.github.jsonnet

  flows:
    registration:
      # Modern two-step flow — the enumeration-safe path (a taken email yields the same generic outcome).
      enable_legacy_one_step: false
      lifespan: 10m
      ui_url: REPLACE_ME

    recovery:
      enabled: true
      use: code
      ui_url: REPLACE_ME
      # Do NOT reveal whether a recovery address exists: an unknown recipient gets the same response.
      notify_unknown_recipients: false

    verification:
      enabled: true
      use: code
      ui_url: REPLACE_ME
      notify_unknown_recipients: false

    login:
      ui_url: REPLACE_ME
      lifespan: 10m

    settings:
      ui_url: REPLACE_ME
      privileged_session_max_age: 15m

    error:
      ui_url: REPLACE_ME
