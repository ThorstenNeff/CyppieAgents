# CYP-628 — jpackage --add-launcher spec for the install-time provisioning entrypoint (ProvisionMain).
# Adds a second launcher (CyppieHubProvision[.exe]) to the CYP-626 app-image alongside the hub launcher; it shares the
# app's --main-jar (server-<version>.jar) and only overrides the main class. The install wizard invokes it once, on
# the host, to mint CYPPIE_MASTER_KEY + the boot tokens + a default platform.config.json (see deploy/windows/README.md).
main-class=com.tneff.cyppieagents.provision.ProvisionMainKt
